services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sendoh
      POSTGRES_PASSWORD: sendoh
      POSTGRES_DB: sendoh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sendoh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendoh"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sendoh_pg:
