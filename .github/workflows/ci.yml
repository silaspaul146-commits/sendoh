name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendoh
          POSTGRES_PASSWORD: sendoh
          POSTGRES_DB: sendoh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sendoh" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SENDOH_ENV: development
      DATABASE_URL: postgresql+psycopg://sendoh:sendoh@localhost:5432/sendoh_test
      TEST_DATABASE_URL: postgresql+psycopg://sendoh:sendoh@localhost:5432/sendoh_test
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
  guest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guest_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash ./scripts/bootstrap_flutter.sh
      - name: Prepare optional Firebase client configuration
        env:
          SENDOH_FIREBASE_CONFIG: ${{ vars.SENDOH_FIREBASE_CONFIG }}
        run: python3 scripts/prepare_push_build.py --output "$RUNNER_TEMP/sendoh-push.json" --android-root apps/organizer_flutter/android
      - name: Build staging Android APK
        working-directory: apps/organizer_flutter
        env:
          SENDOH_API_URL: ${{ vars.SENDOH_STAGING_API_URL || 'https://sendoh.onrender.com' }}
        run: flutter build apk --release --dart-define="API_URL=$SENDOH_API_URL" --dart-define-from-file="$RUNNER_TEMP/sendoh-push.json"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sendoh-android-staging
          path: apps/organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
